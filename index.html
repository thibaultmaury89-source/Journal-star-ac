<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Star Academy Fan Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config = {
  theme: { extend: {
    fontFamily: { display: ['"Playfair Display"', 'Georgia', 'serif'], sans: ['Outfit', 'system-ui', 'sans-serif'] },
    colors: { night: '#070b24', ink: '#0d1238', violet: { glam: '#7c3aed' }, gold: { DEFAULT: '#f5c451', soft: '#ffe9a8', deep: '#b8860b' } }
  } }
};
</script>
<style>
:root {
  --night: #070b24; --ink: #0d1238; --panel: rgba(20, 24, 70, .62); --panel-border: rgba(245, 196, 81, .22);
  --violet: #7c3aed; --violet-hot: #a855f7; --gold: #f5c451; --gold-soft: #ffe9a8; --text: #eef0ff; --muted: #a3a8d6;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); color-scheme: dark; background: var(--night); }
body {
  margin: 0; min-height: 100vh; color: var(--text); font-family: 'Outfit', system-ui, sans-serif; background-color: var(--night);
  background-image:
    radial-gradient(900px 500px at 85% -10%, rgba(124, 58, 237, .45), transparent 60%),
    radial-gradient(700px 500px at -10% 30%, rgba(40, 70, 200, .35), transparent 60%),
    radial-gradient(800px 600px at 50% 120%, rgba(168, 85, 247, .28), transparent 60%);
  background-attachment: fixed; overflow-x: hidden;
}
.font-display { font-family: 'Playfair Display', Georgia, serif; }
.glass { background: var(--panel); border: 1px solid var(--panel-border); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.gold-text { background: linear-gradient(100deg, #b8860b 0%, #ffe9a8 28%, #f5c451 50%, #fff6d6 62%, #d9a520 80%, #b8860b 100%); background-size: 220% auto; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shine 6s linear infinite; }
@keyframes shine { to { background-position: -220% center; } }
.btn-gold { background: linear-gradient(135deg, #ffe9a8, #f5c451 45%, #d9a520); color: #2a1c00; font-weight: 600; box-shadow: 0 6px 22px rgba(245, 196, 81, .35), inset 0 1px 0 rgba(255,255,255,.6); transition: transform .15s, box-shadow .2s, filter .2s; position: relative; overflow: hidden; }
.btn-gold:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 10px 28px rgba(245, 196, 81, .5), inset 0 1px 0 rgba(255,255,255,.6); filter: brightness(1.05); }
.btn-gold:active:not(:disabled) { transform: translateY(0) scale(.98); }
.btn-gold:disabled { opacity: .45; cursor: not-allowed; }
.btn-ghost { border: 1px solid rgba(245, 196, 81, .4); color: var(--gold-soft); transition: background .2s, transform .15s; }
.btn-ghost:hover { background: rgba(245, 196, 81, .12); }
.btn-violet { background: linear-gradient(135deg, #8b5cf6, #6d28d9); color: #fff; font-weight: 600; box-shadow: 0 6px 20px rgba(124, 58, 237, .45); transition: transform .15s, filter .2s; }
.btn-violet:hover { filter: brightness(1.1); transform: translateY(-1px); }
.field { width: 100%; background: rgba(7, 11, 36, .7); border: 1px solid rgba(163, 168, 214, .28); border-radius: 12px; padding: .7rem .9rem; color: var(--text); outline: none; transition: border-color .2s, box-shadow .2s; }
.field:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(245, 196, 81, .2); }
.field::placeholder { color: #6f75a8; }
select.field option { background: #0d1238; color: #eef0ff; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.sparkle-layer { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.sparkle { position: absolute; width: 4px; height: 4px; background: #fff; border-radius: 50%; box-shadow: 0 0 8px 2px rgba(255, 233, 168, .9); opacity: 0; animation: twinkle 4s ease-in-out infinite; }
@keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(.4); } 50% { opacity: .95; transform: scale(1.3); } }
.card-lift { transition: transform .25s, box-shadow .25s, border-color .25s; }
.card-lift:hover { transform: translateY(-4px); box-shadow: 0 16px 40px rgba(124, 58, 237, .35); border-color: rgba(245, 196, 81, .6); }
.vinyl { background: conic-gradient(from 0deg, #1a1a2e, #3b2a6e, #1a1a2e, #5b3aa8, #1a1a2e); animation: spin 7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.pop-in { animation: popin .35s cubic-bezier(.2, .9, .3, 1.2) both; }
@keyframes popin { from { opacity: 0; transform: scale(.94) translateY(8px); } to { opacity: 1; transform: none; } }
.feed-in { animation: feedin .5s ease both; }
@keyframes feedin { from { opacity: 0; transform: translateY(-14px); background: rgba(245, 196, 81, .2); } to { opacity: 1; transform: none; } }
.rise { transform-origin: bottom; animation: rise .9s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes rise { from { transform: scaleY(0); } to { transform: scaleY(1); } }
.nav-active { color: var(--gold); }
.nav-active .nav-dot { opacity: 1; }
.tab-btn { transition: color .2s, background .2s; }
.scroll-x { overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.scroll-x::-webkit-scrollbar { display: none; }
.counter-ok { color: var(--muted); } .counter-warn { color: #fbbf24; } .counter-max { color: #fb7185; font-weight: 600; }
.modal-backdrop { background: rgba(4, 6, 22, .8); backdrop-filter: blur(6px); }
dialog-sheet { display: block; }
::-webkit-scrollbar { width: 8px; height: 8px; } ::-webkit-scrollbar-thumb { background: rgba(168, 85, 247, .45); border-radius: 8px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } .sparkle { display: none; } }
.drop-hot { outline: 2px dashed var(--gold); outline-offset: -3px; background: rgba(245, 196, 81, .1) !important; }
.tier-chip { cursor: grab; -webkit-user-drag: element; touch-action: manipulation; }
.tier-chip:active { cursor: grabbing; }
</style>
</head>
<body>
<div class="sparkle-layer" id="sparkles" aria-hidden="true"></div>

<div id="app" class="relative z-10 min-h-screen flex flex-col">
  <header class="sticky top-0 z-30 glass border-x-0 border-t-0" style="padding-top: env(safe-area-inset-top, 0px)">
    <div class="max-w-6xl mx-auto px-4 py-2.5 flex items-center gap-4">
      <a href="#/home" class="flex items-center gap-2.5 shrink-0" aria-label="Accueil Star Academy Fan Hub">
        <svg viewBox="0 0 48 48" class="w-10 h-10" aria-hidden="true">
          <defs>
            <linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff6d6"/><stop offset=".45" stop-color="#f5c451"/><stop offset="1" stop-color="#b8860b"/></linearGradient>
            <linearGradient id="gs" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
            <clipPath id="sc"><path d="M24 3l5.6 14.2 15.2 1.1-11.7 9.8 3.8 14.8L24 34.1 11.1 42.9l3.8-14.8L3.2 18.3l15.2-1.1z"/></clipPath>
          </defs>
          <path d="M24 3l5.6 14.2 15.2 1.1-11.7 9.8 3.8 14.8L24 34.1 11.1 42.9l3.8-14.8L3.2 18.3l15.2-1.1z" fill="url(#gg)" stroke="#fff3c4" stroke-width=".8"/>
          <g clip-path="url(#sc)"><rect x="-20" y="0" width="14" height="48" fill="url(#gs)" transform="skewX(-20)"><animate attributeName="x" from="-20" to="70" dur="3.4s" repeatCount="indefinite"/></rect></g>
        </svg>
        <div class="leading-none">
          <div class="font-display font-extrabold text-xl gold-text tracking-wide">STAR ACADEMY</div>
          <div class="text-[11px] text-[color:var(--muted)] tracking-[.28em] mt-0.5">FAN HUB</div>
        </div>
      </a>
      <nav class="hidden md:flex items-center gap-1 ml-6" id="topnav" aria-label="Navigation principale"></nav>
      <div class="ml-auto flex items-center gap-2" id="headerUser"></div>
    </div>
  </header>

  <main id="view" class="flex-1 w-full max-w-6xl mx-auto px-4 pt-6 pb-28 md:pb-12" aria-live="polite"></main>

  <footer class="hidden md:block text-center text-xs text-[color:var(--muted)] pb-8 px-4">
    Application de fans non officielle. Avec un compte, votes, mur, tier lists et amis sont partagés entre tous les fans.
  </footer>
</div>

<nav id="bottomnav" class="md:hidden fixed bottom-0 inset-x-0 z-30 glass border-x-0 border-b-0" style="padding-bottom: env(safe-area-inset-bottom, 0px)" aria-label="Navigation mobile"></nav>

<div id="modalRoot"></div>
<div id="toasts" class="fixed z-50 left-1/2 -translate-x-1/2 flex flex-col items-center gap-2 pointer-events-none" style="bottom: calc(env(safe-area-inset-bottom, 0px) + 88px)"></div>

/* =========================================================
   COMPTE À REBOURS — prochain Prime (samedi 21 h 10)
   ========================================================= */
function nextPrime() {
  const now = new Date(), t = new Date(now);
  t.setHours(21, 10, 0, 0);
  const diff = (6 - now.getDay() + 7) % 7;
  t.setDate(now.getDate() + diff);
  const live = now.getDay() === 6 && now >= t && now.getTime() - t.getTime() < 3 * 3600e3;
  if (now > t && !live) t.setDate(t.getDate() + 7);
  return { target: t, live };
}
function countdownParts() {
  const { target, live } = nextPrime();
  if (live) return { live: true };
  let s = Math.max(0, Math.floor((target - Date.now()) / 1000));
  const d = Math.floor(s / 86400); s -= d * 86400;
  const h = Math.floor(s / 3600); s -= h * 3600;
  const m = Math.floor(s / 60); s -= m * 60;
  return { d, h, m, s, target };
}
function tickCountdown() {
  const c = countdownParts();
  const root = $('#cd'); if (!root) return;
  if (c.live) { root.innerHTML = '<div class="font-display text-3xl font-extrabold gold-text">Le prime est en direct</div>'; return; }
  [['d', c.d], ['h', c.h], ['m', c.m], ['s', c.s]].forEach(([k, v]) => { const el = $('[data-cd="' + k + '"]'); if (el) el.textContent = String(v).padStart(2, '0'); });
}
setInterval(tickCountdown, 1000);

function submitVote() {

const TIERS = [
  { id: 'M', label: 'Masterclass', grad: 'linear-gradient(135deg,#ffe9a8,#f5c451 55%,#d9a520)', fg: '#2a1c00' },
  { id: 'S', label: 'Super', grad: 'linear-gradient(135deg,#c084fc,#7c3aed)', fg: '#fff' },
  { id: 'X', label: 'Mid', grad: 'linear-gradient(135deg,#60a5fa,#2563eb)', fg: '#fff' },
  { id: 'L', label: 'J\u2019aime moins', grad: 'linear-gradient(135deg,#fb7185,#be123c)', fg: '#fff' }
];
function tierState() {
  if (!S.tier || typeof S.tier !== 'object') S.tier = { M: [], S: [], X: [], L: [] };
  const valid = new Set(ACADEMICIENS.map(a => a.id)), seen = new Set();
  TIERS.forEach(t => { S.tier[t.id] = (Array.isArray(S.tier[t.id]) ? S.tier[t.id] : []).filter(i => valid.has(i) && !seen.has(i) && seen.add(i)); });
  return S.tier;
}
function tierPool() {
  const t = tierState(), placed = new Set(TIERS.flatMap(x => t[x.id]));
  return ACADEMICIENS.map(a => a.id).filter(i => !placed.has(i));
}
function placeInTier(aid, zone) {
  const t = tierState();
  TIERS.forEach(x => { t[x.id] = t[x.id].filter(i => i !== aid); });
  if (zone !== 'pool' && t[zone]) t[zone].push(aid);
  S.ui.tierSel = null; save(); render();
}
function tierChip(aid) {
  const a = acad(aid); if (!a) return '';
  const sel = S.ui.tierSel === aid;
  return `<button type="button" draggable="true" data-drag="${aid}" data-act="tier-pick" data-id="${aid}" aria-pressed="${sel}" class="tier-chip relative w-14 sm:w-16 text-center rounded-xl p-0.5 transition ${sel ? 'ring-2 ring-[color:var(--gold)] bg-[rgba(245,196,81,.22)] scale-105' : 'hover:bg-white/10'}">
    <img src="${avatarSrc(a)}" alt="${esc(a.name)}" draggable="false" class="w-full aspect-square rounded-full object-cover object-top border border-white/20 pointer-events-none">
    <span class="block text-[10px] leading-tight mt-0.5 truncate pointer-events-none">${esc(a.name)}</span></button>`;
}

  const ranked = ACADEMICIENS.length - pool.length;

  return `

    <div class="flex flex-wrap gap-1.5">${pool.map(tierChip).join('') || '<span class="text-sm text-[color:var(--muted)] px-2">Tout le monde est classé. Tu peux publier !</span>'}</div>

function publishTier() {

// Glisser-déposer (ordinateur)
document.addEventListener('dragstart', (e) => {
  const c = e.target.closest && e.target.closest('[data-drag]'); if (!c) return;
  e.dataTransfer.setData('text/plain', c.dataset.drag); e.dataTransfer.effectAllowed = 'move';
});
document.addEventListener('dragover', (e) => { const z = e.target.closest && e.target.closest('[data-zone]'); if (z) { e.preventDefault(); z.classList.add('drop-hot'); } });
document.addEventListener('dragleave', (e) => { const z = e.target.closest && e.target.closest('[data-zone]'); if (z && !z.contains(e.relatedTarget)) z.classList.remove('drop-hot'); });
document.addEventListener('drop', (e) => {
  const z = e.target.closest && e.target.closest('[data-zone]'); if (!z) return;
  e.preventDefault();
  const id = e.dataTransfer.getData('text/plain');
  if (ACADEMICIENS.some(a => a.id === id)) placeInTier(id, z.dataset.zone);
});

/* =========================================================
   ACTIONS & ÉVÉNEMENTS
   ========================================================= */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id, v = el.dataset.v;
  if (act === 'backdrop') { if (e.target === el) closeModal(); return; }
  switch (act) {
    case 'close': closeModal(); break;
    case 'open-auth': openModal('auth'); break;
    case 'auth-mode': S.ui.modal = { type: 'auth', mode: v }; renderModal(); break;
    case 'guest': S.guest = true; save(); closeModal(); break;
    case 'open-fiche': openModal('fiche', { id }); break;
    case 'open-edit': openModal('edit', { id }); break;
    case 'open-track': openModal('track'); break;
    case 'filter': S.ui.filter = v; render(); break;
    case 'prime': S.ui.prime = v; render(); break;
    case 'pick': S.ui.pick = id; { const t = $('#comment')?.value; render(); const c = $('#comment'); if (c && t != null) { c.value = t; updateCounter(); } } break;
    case 'submit-vote': submitVote(); break;
    case 'vote-for': S.ui.pick = id; S.ui.modal = null; location.hash = '#/votes'; render(); if (!me()) openModal('auth'); break;
    case 'like': {
      const u = me(); if (!u) return openModal('auth');
      if (Cloud.on) { const l = new Set(cloudDoc()?.liked || []); l.has(id) ? l.delete(id) : l.add(id); cloudUpdate({ liked: [...l].slice(-300) }); break; }
      const vt = S.votes.find(x => x.id === id) || S.posts.find(x => x.id === id); if (!vt) return;
      const i = vt.likes.indexOf(u.id); i >= 0 ? vt.likes.splice(i, 1) : vt.likes.push(u.id);
      save(); render(); break;
    }
    case 'tier-pick': S.ui.tierSel = S.ui.tierSel === id ? null : id; render(); break;
    case 'tier-drop': if (S.ui.tierSel) placeInTier(S.ui.tierSel, el.dataset.zone); break;
    case 'tier-reset': S.tier = { M: [], S: [], X: [], L: [] }; S.ui.tierSel = null; save(); render(); break;
    case 'tier-publish': publishTier(); break;
    case 'friend-add': addFriend(id); break;
    case 'friend-add-q': addFriendByPseudo(); break;
    case 'friend-del': removeFriend(id); break;
    case 'social-login': socialLogin(v); break;
    case 'pw-reset': {
      const em = ($('#f_email')?.value || '').trim();
      if (!em) { toast('Saisis ton e-mail dans le formulaire.', 'err'); break; }
      FB.resetPw(em).then(() => toast('E-mail de réinitialisation envoyé.')).catch(e => toast(fbError(e), 'err')); break;
    }
    case 'logout': if (Cloud.mode === 'firebase') { FB.signOut(); toast('À bientôt !'); location.hash = '#/home'; break; } S.session = null; save(); toast('À bientôt !'); location.hash = '#/home'; render(); break;
    case 'del-vote': {
      if (Cloud.on) { const d = cloudDoc() || {}; cloudUpdate({ history: (d.history || []).filter(h => String(h.ts) !== id), vote: d.vote && String(d.vote.ts) === id ? null : (d.vote || null) }); toast('Vote supprimé'); break; }
      S.votes = S.votes.filter(x => x.id !== id); save(); render(); toast('Vote supprimé'); break;
    }
    case 'del-track': S.tracks = S.tracks.filter(x => x.id !== id); save(); render(); break;
    case 'rm-photo': { const f = $('#editForm'); const aid = f.dataset.id; S.overrides[aid] = { ...(S.overrides[aid] || {}) }; delete S.overrides[aid].photo; save(); S.ui.modal = { type: 'edit', id: aid }; renderModal(); render(); break; }
  }
});
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.dataset?.act === 'feed-filter') { S.ui.feedFilter = el.value; render(); }
  if (el.dataset?.act === 'set-fav') { const u = me(); if (Cloud.on) cloudUpdate({ favorite: el.value }); else { u.favorite = el.value; save(); render(); } toast('Favori mis à jour'); }
  if (el.id === 'photoIn' && el.files[0]) {
    const img = new Image(), url = URL.createObjectURL(el.files[0]);
    img.onload = () => {
      const c = document.createElement('canvas'), s = 360; c.width = s; c.height = s * 1.25;
      const ctx = c.getContext('2d'), r = Math.max(c.width / img.width, c.height / img.height);
      ctx.drawImage(img, (c.width - img.width * r) / 2, (c.height - img.height * r) / 2, img.width * r, img.height * r);
      pendingPhoto = c.toDataURL('image/jpeg', .78); $('#photoPrev').src = pendingPhoto; URL.revokeObjectURL(url);
    };
    img.src = url;
  }
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'comment') updateCounter();
  if (e.target.id === 'friendQ') { S.ui.friendQ = e.target.value; const box = $('#friendSuggest'); if (box) box.innerHTML = friendSuggestHTML(); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && S.ui.modal) closeModal();
  if (e.key === 'Enter' && e.target.id === 'comment') { e.preventDefault(); submitVote(); }
  if (e.key === 'Enter' && e.target.id === 'friendQ') { e.preventDefault(); addFriendByPseudo(); }
});

document.addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'setupForm') {
    const err = $('#setupErr'), pseudo = $('#s_pseudo').value.trim(), fav = $('#s_fav').value;
    if (!/^[\p{L}\p{N}_. -]{3,16}$/u.test(pseudo)) return err.textContent = 'Pseudo de 3 à 16 caractères (lettres, chiffres, _ . -).';
    const taken = Object.entries(Cloud.docs).some(([id, x]) => id !== Cloud.uid && x.pseudo && x.pseudo.toLowerCase() === pseudo.toLowerCase());
    if (taken) return err.textContent = 'Ce pseudo est déjà pris.';
    const d = cloudDoc() || {};
    S.ui.pick = null; closeModal();
    await cloudUpdate({ pseudo, favorite: fav, createdAt: d.createdAt || Date.now() });
    toast('Bienvenue, ' + pseudo + ' !'); return;
  }
  if (f.id === 'authForm') {
    const reg = f.dataset.mode === 'register', err = $('#authErr');
    const email = $('#f_email').value.trim().toLowerCase(), pw = $('#f_pw').value;
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return err.textContent = 'Entre une adresse e-mail valide.';
    if (pw.length < 6) return err.textContent = 'Le mot de passe doit contenir au moins 6 caractères.';
    if (Cloud.mode === 'firebase') {
      const btn = f.querySelector('button[type=submit]'); if (btn) btn.disabled = true;
      try {
        if (reg) {
          const pseudo = $('#f_pseudo').value.trim(), fav = $('#f_fav').value;
          if (!/^[\p{L}\p{N}_. -]{3,16}$/u.test(pseudo)) { err.textContent = 'Pseudo de 3 à 16 caractères (lettres, chiffres, _ . -).'; return; }
          if (Object.values(Cloud.docs).some(x => x.pseudo && x.pseudo.toLowerCase() === pseudo.toLowerCase())) { err.textContent = 'Ce pseudo est déjà pris.'; return; }
          const cred = await FB.signUp(email, pw);
          Cloud.uid = cred.user.uid; Cloud.email = email;
          S.ui.pick = null; closeModal();
          await cloudUpdate({ pseudo, favorite: fav, createdAt: Date.now() });
          toast('Bienvenue, ' + pseudo + ' !');
        } else {
          await FB.signIn(email, pw);
          closeModal(); toast('Re-bonjour !');
          setTimeout(() => { if (Cloud.uid && !me()) openModal('setup'); }, 1500);
        }
      } catch (ex) { err.textContent = fbError(ex); }
      finally { if (btn) btn.disabled = false; }
      return;
    }
    const h = await hashPw(email, pw);
    if (reg) {
      const pseudo = $('#f_pseudo').value.trim();
      if (pseudo.length < 3) return err.textContent = 'Le pseudo doit contenir au moins 3 caractères.';
      if (S.users.some(u => u.email === email)) return err.textContent = 'Cet e-mail est déjà inscrit. Connecte-toi.';
      if (S.users.some(u => u.pseudo.toLowerCase() === pseudo.toLowerCase())) return err.textContent = 'Ce pseudo est déjà pris.';
      const u = { id: uid(), email, pseudo, hash: h, favorite: $('#f_fav').value, createdAt: Date.now() };
      S.users.push(u); S.session = u.id; save(); S.ui.pick = null; closeModal(); render(); toast('Bienvenue, ' + pseudo + ' !');
    } else {
      const u = S.users.find(x => x.email === email && x.hash === h);
      if (!u) return err.textContent = 'E-mail ou mot de passe incorrect.';
      S.session = u.id; save(); S.ui.pick = null; closeModal(); render(); toast('Re-bonjour, ' + u.pseudo + ' !');
    }
  }
  if (f.id === 'editForm') {
    const id = f.dataset.id, num = (v, d = 0) => { const n = parseInt(v, 10); return isNaN(n) ? d : Math.max(0, n); };
    const prev = S.overrides[id] || {};
    const rawShort = $('#e_short').value.trim();
    if (rawShort && !cleanShort(rawShort)) return toast('Lien du short invalide (YouTube, TikTok, Instagram ou TF1).', 'err');
    S.overrides[id] = { ...prev, status: $('#e_status').value, age: $('#e_age').value ? num($('#e_age').value, null) : null, city: $('#e_city').value.trim() || null, insta: cleanHandle($('#e_insta').value), tiktok: cleanTiktok($('#e_tiktok').value), shortUrl: cleanShort($('#e_short').value), nominations: num($('#e_nom').value), tops: num($('#e_tops').value) };
    if (pendingPhoto) S.overrides[id].photo = pendingPhoto;
    save(); S.ui.modal = { type: 'fiche', id }; render(); toast('Fiche mise à jour');
  }
  if (f.id === 'trackForm') {
    const title = $('#t_title').value.trim();
    if (!title) return $('#trackErr').textContent = 'Indique le titre du morceau.';
    const performers = [...f.querySelectorAll('input[type=checkbox]:checked')].map(c => c.value);
    S.tracks.push({ id: uid(), prime: $('#t_prime').value, title, artist: $('#t_artist').value.trim() || 'Artiste inconnu', performers });
    S.ui.prime = $('#t_prime').value; save(); closeModal(); render(); toast('Titre ajouté');
  }
});

(function sparkles() {
  const layer = $('#sparkles');
  for (let i = 0; i < 38; i++) {
    const s = document.createElement('span'); s.className = 'sparkle';
